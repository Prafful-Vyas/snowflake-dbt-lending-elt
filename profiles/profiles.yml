# Local and CI builds run on DuckDB, so no Snowflake account is needed to develop or test.
# Snowflake targets use key-pair auth from environment variables (never passwords).
lending_elt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'lending.duckdb') }}"
      schema: main
      threads: 4
    snowflake_ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: TRANSFORMER
      warehouse: TRANSFORM_WH
      database: LENDING_CI
      schema: "pr_{{ env_var('PR_NUMBER', 'local') }}"
      threads: 8
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: TRANSFORMER
      warehouse: TRANSFORM_WH
      database: LENDING
      schema: analytics
      threads: 8
      query_tag: dbt_lending_elt
